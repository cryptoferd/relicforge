name: RelicForge Contracts V1

on:
  push:
    branches:
      - contracts-v1-production
    paths:
      - "contracts/production/**"
      - "test/v1/**"
      - "script/v1/**"
      - "foundry.toml"
      - ".github/workflows/contracts-v1.yml"

  pull_request:
    paths:
      - "contracts/production/**"
      - "test/v1/**"
      - "script/v1/**"
      - "foundry.toml"

permissions:
  contents: read

jobs:
  contracts-v1:
    name: Compile, Size and Security Test V1
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # RC2.1 green baseline. Pin tool behavior during security hardening.
          version: v1.7.1

      - name: Compile contracts
        run: forge build

      - name: Enforce production runtime size limits
        shell: bash
        run: |
          set -e

          check_size() {
            CONTRACT="$1"
            BYTECODE=$(forge inspect "$CONTRACT" deployedBytecode)
            HEX="${BYTECODE#0x}"
            BYTES=$((${#HEX} / 2))

            echo "$CONTRACT runtime: $BYTES bytes"

            if [ "$BYTES" -gt 24576 ]; then
              echo "::error::$CONTRACT exceeds EIP-170: $BYTES bytes"
              exit 1
            fi
          }

          check_size RelicCollectionV1
          check_size RelicProjectDataV1
          check_size RelicRendererV1
          check_size RelicForgeFeePolicyV1
          check_size RelicForgeFactoryV1
          check_size RelicRandomnessMockV1
          check_size RelicChainlinkVRFV25DirectFundingAdapterV1

      - name: Run unit, fuzz, invariant, VRF and gas-DoS tests
        run: forge test -vvv

      - name: Install Slither
        id: slither_install
        if: always()
        continue-on-error: true
        run: pipx install slither-analyzer

      - name: Run Slither RC4 platform-fee baseline
        id: slither
        if: always() && steps.slither_install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          slither . \
            --filter-paths "test/v1|script/v1" \
            --exclude-informational \
            --exclude-optimization \
            --json slither-rc4-fees.json

      - name: Upload Slither RC4 platform-fee baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-rc4-fees
          path: slither-rc4-fees.json
          if-no-files-found: ignore
